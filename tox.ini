[tox]
envlist = py{310,311,312}-release, py311-pyqt{68,69,610}
skip_missing_interpreters = true
isolated_build = false

[testenv]
deps =
    release: -cconstraints-release.txt
    -rrequirements.txt
    pyqt68: PyQt6==6.8.1
    pyqt69: PyQt6==6.9.1
    pyqt610: PyQt6==6.10.1
commands =
    python -m pytest tests/ -q
