# Tooling configuration only; the application is still installed from
# requirements.txt and started with run.py.

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = ["Old-Version", "TestOyun", "build", "dist", "examples"]

[tool.ruff.lint]
# Correctness rules only: things that are bugs or dead code, never style.
#   E9   syntax errors
#   F    pyflakes (undefined names, unused imports/variables, redefinitions)
#   PLE  pylint errors
#   B006 mutable default argument      B023 closure captures a loop variable
#   B033 duplicate item in a set literal
select = ["E9", "F", "PLE", "B006", "B023", "B033"]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: the "unused" imports are their public surface.
"__init__.py" = ["F401"]
"src/core/translator.py" = ["F401"]
"src/core/translation_pipeline.py" = ["F401"]
