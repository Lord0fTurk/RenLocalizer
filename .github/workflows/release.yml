name: Build and Release

on:
  push:
    tags:
      - '*'
  # Manual trigger for testing builds WITHOUT publishing a release.
  # Artifacts are uploaded to the run page only.
  workflow_dispatch:

jobs:
  # ============================================
  # Windows Build (unchanged — onedir zip)
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-release.txt pyinstaller
          pip install -c constraints-release.txt -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller RenLocalizer.spec

      - name: Create archive
        run: |
          cd dist
          Compress-Archive -Path RenLocalizer -DestinationPath ../RenLocalizer-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: RenLocalizer-Windows-x64.zip

  # ============================================
  # Linux Build → AppImage
  # ============================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 imagemagick xvfb \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xfixes0 libxcb-shape0 libxcb-glx0 \
            libxcb-cursor0 \
            fonts-noto-color-emoji

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-release.txt pyinstaller
          pip install -c constraints-release.txt -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller RenLocalizer.spec

      - name: Smoke test Qt startup (Linux native)
        run: |
          export RENLOCALIZER_QT_SMOKE_TEST="1"
          xvfb-run -a ./dist/RenLocalizer/RenLocalizer

      - name: Smoke test Qt startup (Linux software fallback)
        run: |
          export RENLOCALIZER_QT_SMOKE_TEST="1"
          export RENLOCALIZER_QT_RENDER_MODE="software"
          xvfb-run -a ./dist/RenLocalizer/RenLocalizer

      - name: Convert icon
        run: |
          convert icon.ico[0] -resize 256x256 renlocalizer.png

      - name: Bundle emoji font into build output
        run: |
          # Copy Noto Color Emoji font so emoji icons render on all Linux systems
          EMOJI_FONT="/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf"
          if [ -f "$EMOJI_FONT" ]; then
            mkdir -p dist/RenLocalizer/fonts
            cp "$EMOJI_FONT" dist/RenLocalizer/fonts/
            echo "✓ Bundled NotoColorEmoji.ttf"
          else
            echo "⚠ NotoColorEmoji.ttf not found at expected path, searching..."
            FOUND=$(find /usr/share/fonts -iname 'NotoColorEmoji*' -type f | head -1)
            if [ -n "$FOUND" ]; then
              mkdir -p dist/RenLocalizer/fonts
              cp "$FOUND" dist/RenLocalizer/fonts/NotoColorEmoji.ttf
              echo "✓ Bundled from $FOUND"
            else
              echo "✗ No emoji font found — icons may not render on minimal distros"
            fi
          fi

      - name: Create AppImage
        run: |
          # Create AppDir structure
          mkdir -p RenLocalizer.AppDir/usr/bin
          
          # Copy PyInstaller output (includes bundled fonts/)
          cp -R dist/RenLocalizer RenLocalizer.AppDir/usr/bin/RenLocalizer
          
          # Copy AppImage metadata
          cp build/linux/AppRun RenLocalizer.AppDir/AppRun
          chmod +x RenLocalizer.AppDir/AppRun
          
          cp build/linux/renlocalizer.desktop RenLocalizer.AppDir/renlocalizer.desktop
          cp renlocalizer.png RenLocalizer.AppDir/renlocalizer.png
          
          # Create .DirIcon for the AppImage file itself (standard requirement)
          cp renlocalizer.png RenLocalizer.AppDir/.DirIcon
          
          # Also place .desktop and icon in standard locations for integration
          mkdir -p RenLocalizer.AppDir/usr/share/applications
          mkdir -p RenLocalizer.AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/linux/renlocalizer.desktop RenLocalizer.AppDir/usr/share/applications/
          cp renlocalizer.png RenLocalizer.AppDir/usr/share/icons/hicolor/256x256/apps/renlocalizer.png
          
          # Download appimagetool
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          
          # Build AppImage using extracted tool (avoids FUSE error)
          ARCH=x86_64 ./squashfs-root/AppRun RenLocalizer.AppDir RenLocalizer-Linux-x64.AppImage
          chmod +x RenLocalizer-Linux-x64.AppImage

      - name: Install portable launcher script (Linux tar.gz)
        run: |
          cp RenLocalizer.sh dist/RenLocalizer/RenLocalizer.sh
          chmod +x dist/RenLocalizer/RenLocalizer.sh

      - name: Smoke test AppImage startup (Linux native)
        run: |
          export RENLOCALIZER_QT_SMOKE_TEST="1"
          export APPIMAGE_EXTRACT_AND_RUN="1"
          xvfb-run -a ./RenLocalizer-Linux-x64.AppImage

      - name: Smoke test AppImage startup (Linux software fallback)
        run: |
          export RENLOCALIZER_QT_SMOKE_TEST="1"
          export RENLOCALIZER_QT_RENDER_MODE="software"
          export APPIMAGE_EXTRACT_AND_RUN="1"
          xvfb-run -a ./RenLocalizer-Linux-x64.AppImage

      - name: Smoke test portable launcher (Linux tar.gz payload)
        run: |
          export RENLOCALIZER_QT_SMOKE_TEST="1"
          xvfb-run -a ./dist/RenLocalizer/RenLocalizer.sh

      - name: Create tar.gz (Linux Portable)
        run: |
          cd dist
          tar -czvf ../RenLocalizer-Linux-x64.tar.gz RenLocalizer
          cd ..

      - name: Upload artifact (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-appimage
          path: RenLocalizer-Linux-x64.AppImage

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-targz
          path: RenLocalizer-Linux-x64.tar.gz

  # ============================================
  # macOS Build → .app bundle → DMG
  # ============================================
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-release.txt pyinstaller
          pip install -c constraints-release.txt -r requirements.txt

      - name: Convert icon.png to icon.icns (picked up by spec BUNDLE)
        run: |
          mkdir -p icon.iconset
          sips -z 16   16   icon.png --out icon.iconset/icon_16x16.png
          sips -z 32   32   icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32   32   icon.png --out icon.iconset/icon_32x32.png
          sips -z 64   64   icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128  128  icon.png --out icon.iconset/icon_128x128.png
          sips -z 256  256  icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256  256  icon.png --out icon.iconset/icon_256x256.png
          sips -z 512  512  icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512  512  icon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset
          ls -la icon.icns

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller RenLocalizer.spec

      - name: Verify .app bundle was produced
        run: |
          if [ ! -d "dist/RenLocalizer.app" ]; then
            echo "::error::dist/RenLocalizer.app missing — spec BUNDLE block did not run"
            ls -la dist/
            exit 1
          fi
          ls -la dist/RenLocalizer.app/Contents/

      - name: Ad-hoc codesign (.app must be signed or Gatekeeper reports 'damaged')
        run: |
          codesign --force --deep --sign - dist/RenLocalizer.app
          codesign --verify --deep --strict dist/RenLocalizer.app
          echo "✓ Ad-hoc signature valid"

      - name: Smoke test Qt startup (offscreen)
        run: |
          export RENLOCALIZER_QT_SMOKE_TEST="1"
          export QT_QPA_PLATFORM="offscreen"
          ./dist/RenLocalizer.app/Contents/MacOS/RenLocalizer

      - name: Smoke test Qt startup (offscreen + software rendering fallback)
        run: |
          export RENLOCALIZER_QT_SMOKE_TEST="1"
          export QT_QPA_PLATFORM="offscreen"
          export QT_QUICK_BACKEND="software"
          ./dist/RenLocalizer.app/Contents/MacOS/RenLocalizer

      - name: Create DMG (.app + Applications symlink for drag-install)
        run: |
          mkdir -p dmg_contents
          cp -R dist/RenLocalizer.app dmg_contents/
          ln -s /Applications dmg_contents/Applications
          sync
          sleep 3
          hdiutil create \
            -volname "RenLocalizer" \
            -srcfolder dmg_contents \
            -ov \
            -format UDZO \
            RenLocalizer-macOS-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: RenLocalizer-macOS-arm64.dmg

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-appimage

      - name: Download Linux tar.gz artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-targz

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            RenLocalizer-Windows-x64.zip
            RenLocalizer-Linux-x64.AppImage
            RenLocalizer-Linux-x64.tar.gz
            RenLocalizer-macOS.dmg
          body: ""
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
